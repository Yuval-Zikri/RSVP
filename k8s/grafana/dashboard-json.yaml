apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
data:
  rsvp-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 20,
          "title": "Backend Service Health (RED Metrics)",
          "type": "row"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"backend\"}[1m])) or vector(0)",
              "legendFormat": "Total RPS",
              "refId": "A"
            }
          ],
          "title": "Requests Per Second (RPS)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "unit": "s"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend\"}[5m])) by (le)) or vector(0)",
              "legendFormat": "p95 Latency",
              "refId": "A"
            }
          ],
          "title": "95th Percentile Latency",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "textMode": "auto",
            "unit": "percentunit"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "(sum(rate(http_requests_total{job=\"backend\",http_status=~\"5..\"}[1m])) or vector(0)) / (sum(rate(http_requests_total{job=\"backend\"}[1m])) or vector(1))",
              "legendFormat": "Error Rate",
              "refId": "A"
            }
          ],
          "title": "Error Rate (5xx)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "id": 4,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(http_status) (rate(http_requests_total{job=\"backend\"}[1m])) or vector(0)",
              "legendFormat": "{{http_status}}",
              "refId": "A"
            }
          ],
          "title": "Traffic by Status Code",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(endpoint) (rate(http_requests_total{job=\"backend\"}[1m])) or vector(0)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "title": "Traffic by Endpoint",
          "type": "timeseries"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 22,
          "title": "Infrastructure Stats",
          "type": "row"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 16 },
          "id": 9,
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{image!=\"\", namespace=\"rsvp-app\", container!=\"POD\", container!=\"\"}[5m])) or vector(0)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 16 },
          "id": 10,
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(pod) (container_memory_working_set_bytes{image!=\"\", namespace=\"rsvp-app\", container!=\"POD\", container!=\"\"}) or vector(0)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 22 },
          "id": 11,
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(up{job=\"backend\"}) or vector(0)",
              "legendFormat": "Replicas",
              "refId": "A"
            }
          ],
          "title": "Backend Replicas Running",
          "type": "stat"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["rsvp"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "RSVP System Monitor",
      "uid": "rsvp-system-monitor",
      "version": 2,
      "weekStart": ""
    }