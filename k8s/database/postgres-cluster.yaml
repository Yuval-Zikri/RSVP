apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: rsvp-app
spec:
  instances: 2

  # Basic storage configuration
  storage:
    size: 1Gi

  # Bootstrap configuration (initial database creation)
  bootstrap:
    initdb:
      database: event_db
      owner: user

  # Monitoring/Health checks are automatic in CNPG
