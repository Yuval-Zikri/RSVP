apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
data:
  rsvp-overview.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 20,
          "title": "Backend Service Health (RED Metrics)",
          "type": "row"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 1 },
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total{job=\"backend\"}[2m])) or vector(0)",
              "legendFormat": "Total RPS",
              "refId": "A"
            }
          ],
          "title": "Requests Per Second (RPS)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto",
            "unit": "s"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend\"}[5m])) by (le)) or vector(0)",
              "legendFormat": "p95 Latency",
              "refId": "A"
            }
          ],
          "title": "95th Percentile Latency",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false },
            "textMode": "auto",
            "unit": "percentunit"
          },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "(sum(rate(http_requests_total{job=\"backend\",http_status=~\"5..\"}[2m])) or vector(0)) / (sum(rate(http_requests_total{job=\"backend\"}[2m])) or vector(1))",
              "legendFormat": "Error Rate",
              "refId": "A"
            }
          ],
          "title": "Error Rate (5xx)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 30,
          "title": "Business Performance Indicators",
          "type": "row"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 7 },
          "id": 31,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false }
          },
          "targets": [
            {
              "expr": "sum(increase(events_created_total[1h])) or vector(0)",
              "legendFormat": "Events Created",
              "refId": "A"
            }
          ],
          "title": "New Events (Last Hour)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 7 },
          "id": 32,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false }
          },
          "targets": [
            {
              "expr": "sum(increase(invitations_sent_total[1h])) or vector(0)",
              "legendFormat": "Invites Sent",
              "refId": "A"
            }
          ],
          "title": "Invitations Sent (Last Hour)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 7 },
          "id": 33,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false }
          },
          "targets": [
            {
              "expr": "sum(increase(rsvps_submitted_total[1h])) or vector(0)",
              "legendFormat": "RSVPs",
              "refId": "A"
            }
          ],
          "title": "RSVPs Received (Last Hour)",
          "type": "stat"
        },
        {
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 12 },
          "id": 22,
          "title": "Infrastructure Stats",
          "type": "row"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 13 },
          "id": 9,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(pod) (rate(container_cpu_usage_seconds_total{image!=\"\", namespace=\"rsvp-app\", container!=\"POD\", container!=\"\"}[5m])) or vector(0)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod CPU Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 13 },
          "id": 10,
          "options": { "legend": { "displayMode": "table", "placement": "bottom" } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum by(pod) (container_memory_working_set_bytes{image!=\"\", namespace=\"rsvp-app\", container!=\"POD\", container!=\"\"}) or vector(0)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod Memory Usage",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 20 },
          "id": 11,
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "datasource": { "uid": "prometheus" },
              "expr": "sum(up{job=\"backend\"})",
              "legendFormat": "Backend Replicas",
              "refId": "A"
            }
          ],
          "title": "Healthy Backend Pods",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 20 },
          "id": 40,
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["sum"] } },
          "targets": [
            {
              "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"rsvp-app\"}) or vector(0)",
              "legendFormat": "Restarts",
              "refId": "A"
            }
          ],
          "title": "Total Pod Restarts (App)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "prometheus" },
          "gridPos": { "h": 5, "w": 12, "x": 12, "y": 20 },
          "id": 50,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "expr": "sum by(http_status) (rate(http_requests_total{job=\"backend\"}[5m]))",
              "legendFormat": "Status {{http_status}}",
              "refId": "A"
            }
          ],
          "title": "Traffic Breakdown",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["rsvp", "kubernetes", "professional"],
      "templating": { "list": [] },
      "time": { "from": "now-30m", "to": "now" },
      "title": "RSVP System Monitor v2",
      "uid": "rsvp-system-monitor",
      "version": 3,
      "weekStart": ""
    }
