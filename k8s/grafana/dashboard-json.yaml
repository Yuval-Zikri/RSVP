apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
data:
  backend-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true }, "tooltip": { "mode": "single", "sort": "none" } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "up{job=\"backend\"}", "legendFormat": "Backend Status", "refId": "A" } ],
          "title": "Backend Availability (1 = Up, 0 = Down)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "sum(up{job=\"backend\"})", "refId": "A" } ],
          "title": "Number of Backend Replicas Running",
          "type": "stat"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "templating": { "list": [ { "current": { "selected": false, "text": "Prometheus", "value": "Prometheus" }, "hide": 2, "includeAll": false, "label": "datasource", "multi": false, "name": "DS_PROMETHEUS", "query": "prometheus", "refresh": 1, "type": "datasource" } ] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Backend Monitoring Dashboard",
      "uid": "backend-monitor",
      "version": 1
    }

  nodes-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "up{job=\"kubernetes-nodes\"}", "legendFormat": "Node Up", "refId": "A" } ],
          "title": "Nodes Availability",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))", "legendFormat": "CPU %", "refId": "A" } ],
          "title": "CPU Utilization (per node)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))", "legendFormat": "Mem %", "refId": "A" } ],
          "title": "Memory Utilization (per node)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "100 * (1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}))", "legendFormat": "Disk %", "refId": "A" } ],
          "title": "Root Filesystem Usage (per node)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 16 },
          "id": 5,
          "targets": [ { "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }, "editorMode": "code", "expr": "count(node_uname_info)", "refId": "A" } ],
          "title": "Node Count",
          "type": "stat"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "time": { "from": "now-15m", "to": "now" },
      "title": "Kubernetes Nodes Dashboard",
      "uid": "nodes-monitor",
      "version": 1
    }

  pods-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "sum(up{job=\"kubernetes-pods\", namespace=~\"rsvp-app\"})", "refId": "A" } ],
          "title": "Number of Scraped Pods (rsvp-app)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "id": 2,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"rsvp-app\",container!~\"POD\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod CPU (cores) - rsvp-app",
          "type": "gauge"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "id": 3,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"rsvp-app\",container!~\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod Memory (bytes) - rsvp-app",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 14 },
          "id": 4,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "max by (pod) (kube_pod_container_status_restarts_total{namespace=\"rsvp-app\"})", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod Restarts (total)",
          "type": "table"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 14 },
          "id": 5,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "sum by (pod) (rate(http_request_duration_seconds_sum{job=\"backend\",namespace=\"rsvp-app\"}[5m])) / sum by (pod) (rate(http_request_duration_seconds_count{job=\"backend\",namespace=\"rsvp-app\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod Request Latency (avg) - rsvp-app (if instrumented)",
          "type": "timeseries"
        }
        ,
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 20 },
          "id": 6,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "time() - max by (pod) (container_start_time_seconds{namespace=\"rsvp-app\",container!~\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod Uptime (seconds) - rsvp-app",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 20 },
          "id": 7,
          "targets": [ { "datasource": { "uid": "Prometheus" }, "editorMode": "code", "expr": "sum by (pod) (power_usage_watts{namespace=\"rsvp-app\"})", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Pod Power Usage (watts) - rsvp-app",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "time": { "from": "now-15m", "to": "now" },
      "title": "Kubernetes Pods Dashboard",
      "uid": "pods-monitor",
      "version": 1
    }

  services-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "targets": [ { "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{pod=~\"(grafana.*|prometheus.*|frontend.*|backend.*|postgres.*|jenkins.*)\",container!~\"POD\"}[5m]))", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "CPU (cores) - services",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "targets": [ { "expr": "sum by (pod) (container_memory_working_set_bytes{pod=~\"(grafana.*|prometheus.*|frontend.*|backend.*|postgres.*|jenkins.*)\",container!~\"POD\"})", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Memory (working set bytes) - services",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "targets": [ { "expr": "up{pod=~\"(grafana.*|prometheus.*|frontend.*|backend.*|postgres.*|jenkins.*)\"}", "legendFormat": "{{pod}}", "refId": "A" } ],
          "title": "Availability (up) - services",
          "type": "stat"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "time": { "from": "now-15m", "to": "now" },
      "title": "Services Overview",
      "uid": "services-overview",
      "version": 1
    }

  backend-observability.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            { "editorMode": "code", "expr": "(histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"backend\",namespace=~\"rsvp-app\"}[5m])) by (le))) or vector(0)", "legendFormat": "p50", "refId": "A" },
            { "editorMode": "code", "expr": "(histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"backend\",namespace=~\"rsvp-app\"}[5m])) by (le))) or vector(0)", "legendFormat": "p95", "refId": "B" },
            { "editorMode": "code", "expr": "(histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"backend\",namespace=~\"rsvp-app\"}[5m])) by (le))) or vector(0)", "legendFormat": "p99", "refId": "C" }
          ],
          "title": "Backend Response Time (p50 / p95 / p99)",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "targets": [ { "editorMode": "code", "expr": "(sum(rate(http_requests_total{job=\"backend\",namespace=~\"rsvp-app\"}[1m]))) or vector(0)", "legendFormat": "RPS", "refId": "A" } ],
          "title": "Traffic — Requests Per Second",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "targets": [
            { "editorMode": "code", "expr": "(sum(rate(http_requests_total{job=\"backend\",namespace=~\"rsvp-app\",status=~\"4..\"}[5m]))) or vector(0)", "legendFormat": "4xx/s", "refId": "A" },
            { "editorMode": "code", "expr": "(sum(rate(http_requests_total{job=\"backend\",namespace=~\"rsvp-app\",status=~\"5..\"}[5m]))) or vector(0)", "legendFormat": "5xx/s", "refId": "B" }
          ],
          "title": "Errors — 4xx / 5xx Rates",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "targets": [
            { "editorMode": "code", "expr": "sum by (instance) (rate(process_cpu_seconds_total{job=\"backend\"}[5m]))", "legendFormat": "CPU (proc seconds/s)", "refId": "A" },
            { "editorMode": "code", "expr": "sum by (instance) (process_resident_memory_bytes{job=\"backend\"})", "legendFormat": "Resident Memory (bytes)", "refId": "B" },
            { "editorMode": "code", "expr": "(sum(backend_thread_pool_active_threads{namespace=~\"rsvp-app\"}) by (pod)) or vector(0)", "legendFormat": "ThreadPool Active (if instrumented)", "refId": "C" }
          ],
          "title": "Saturation — CPU, Memory, Thread Pool",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 14 },
          "id": 5,
          "targets": [
            { "editorMode": "code", "expr": "(sum(rate(http_request_timeouts_total{job=\"backend\",namespace=~\"rsvp-app\"}[5m]))) or vector(0)", "legendFormat": "Timeouts/s", "refId": "A" },
            { "editorMode": "code", "expr": "(sum(rate(http_request_retries_total{job=\"backend\",namespace=~\"rsvp-app\"}[5m]))) or vector(0)", "legendFormat": "Retries/s", "refId": "B" }
          ],
          "title": "Timeouts & Retry Count",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "time": { "from": "now-15m", "to": "now" },
      "title": "Backend Observability",
      "uid": "backend-observability",
      "version": 1
    }

  postgres-observability.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "id": 1,
          "targets": [ { "editorMode": "code", "expr": "sum(rate(pg_stat_database_xact_commit{instance=~\".*postgres.*\"}[1m]) + rate(pg_stat_database_xact_rollback{instance=~\".*postgres.*\"}[1m]))", "legendFormat": "Transactions/s", "refId": "A" } ],
          "title": "Request Rate — Transactions / sec",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "id": 2,
          "targets": [
            { "editorMode": "code", "expr": "histogram_quantile(0.50, sum(rate(pg_query_duration_seconds_bucket{instance=~\".*postgres.*\"}[5m])) by (le))", "legendFormat": "p50", "refId": "A" },
            { "editorMode": "code", "expr": "histogram_quantile(0.95, sum(rate(pg_query_duration_seconds_bucket{instance=~\".*postgres.*\"}[5m])) by (le))", "legendFormat": "p95", "refId": "B" },
            { "editorMode": "code", "expr": "histogram_quantile(0.99, sum(rate(pg_query_duration_seconds_bucket{instance=~\".*postgres.*\"}[5m])) by (le))", "legendFormat": "p99", "refId": "C" }
          ],
          "title": "Response Time (histograms)",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "id": 3,
          "targets": [ { "editorMode": "code", "expr": "sum(rate(pg_stat_database_conflicts_total{instance=~\".*postgres.*\"}[5m]))", "legendFormat": "Conflicts/s", "refId": "A" } ],
          "title": "Error / Conflict Rate",
          "type": "timeseries"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 6 },
          "id": 4,
          "targets": [ { "editorMode": "code", "expr": "pg_stat_activity_count{state=\"active\"}", "legendFormat": "Active Connections", "refId": "A" } ],
          "title": "Active Connections",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 6 },
          "id": 5,
          "targets": [
            { "editorMode": "code", "expr": "100 * sum(pg_stat_database_blks_hit{instance=~\".*postgres.*\"}) / (sum(pg_stat_database_blks_hit{instance=~\".*postgres.*\"}) + sum(pg_stat_database_blks_read{instance=~\".*postgres.*\"}))", "legendFormat": "Cache Hit %", "refId": "A" }
          ],
          "title": "Cache Hit Ratio (%)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 6 },
          "id": 6,
          "targets": [
            { "editorMode": "code", "expr": "sum(pg_wal_lsn_diff{instance=~\".*postgres.*\"})", "legendFormat": "WAL LSN Diff (bytes) - if available", "refId": "A" },
            { "editorMode": "code", "expr": "sum(pg_wal_bytes{instance=~\".*postgres.*\"})", "legendFormat": "WAL bytes (if exported)", "refId": "B" }
          ],
          "title": "WAL / Binlog Size (if exported)",
          "type": "stat"
        },
        {
          "datasource": { "uid": "Prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 7,
          "targets": [
            { "editorMode": "code", "expr": "topk(10, pg_stat_activity_long_running_queries{instance=~\".*postgres.*\"})", "legendFormat": "Long-running queries (top 10) - if instrumented", "refId": "A" },
            { "editorMode": "code", "expr": "topk(10, max by (pid,datname) (pg_query_duration_seconds_max{instance=~\".*postgres.*\"}))", "legendFormat": "Query duration (max) - fallback", "refId": "B" }
          ],
          "title": "Long-running Queries (top 10) — if instrumented",
          "type": "table"
        }
      ],
      "schemaVersion": 38,
      "style": "dark",
      "time": { "from": "now-15m", "to": "now" },
      "title": "Postgres Observability",
      "uid": "postgres-observability",
      "version": 2
    }
