apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: rsvp-app
spec:
  instances: 3

  # Automatic failover when primary pod is killed
  primaryUpdateStrategy: unsupervised

  # Storage with Minikube's standard StorageClass
  storage:
    size: 1Gi
    storageClass: standard

  # PostgreSQL settings for HA
  postgresql:
    parameters:
      # Ensure data is replicated to replicas before commit returns
      synchronous_commit: "on"
  minSyncReplicas: 1

  # Bootstrap configuration (initial database creation)
  bootstrap:
    initdb:
      database: event_db
      owner: user

  # Monitoring/Health checks are automatic in CNPG
