apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: event-manager-backend:latest
        imagePullPolicy: Never # Use local image for Minikube/Kind
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          value: postgresql://user:password@postgres:5432/event_db
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
