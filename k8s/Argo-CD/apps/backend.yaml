apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/Yuval-Zikri/RSVP.git
    targetRevision: deploy
    path: k8s/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: rsvp-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
