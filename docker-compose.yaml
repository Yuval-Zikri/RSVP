version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: event_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/event_db
      BASE_URL: https://laudably-shameful-eulalia.ngrok-free.dev
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./frontend/src/background:/app/backgrounds

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "frontend:80"
      - "--log=stdout"
    ports:
      - "4040:4040"  # ngrok web interface
    depends_on:
      - frontend
    env_file:
      - ./backend/.env 

volumes:
  postgres_data:


