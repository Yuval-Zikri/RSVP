apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rsvp-app
  namespace: argo
spec:
  project: default
  source:
    repoURL: https://github.com/Yuval-Zikri/RSVP.git
    targetRevision: HEAD
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: rsvp-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
