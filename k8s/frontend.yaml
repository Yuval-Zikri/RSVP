apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: event-manager-frontend:latest
        imagePullPolicy: Never # Use local image for Minikube/Kind
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort # Or LoadBalancer if supported
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
